<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Thank You</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ---- Custom Properties ---- */
    :root {
      --bg-gradient-onyx: linear-gradient(to bottom right,
          hsl(240, 1%, 25%) 3%,
          hsl(0, 0%, 19%) 97%);
      --bg-gradient-jet: linear-gradient(to bottom right,
          hsla(240, 1%, 18%, 0.25) 0%,
          hsla(240, 2%, 11%, 0) 100%),
        hsl(240, 2%, 13%);
      --text-gradient-yellow: linear-gradient(to right,
          hsl(45, 100%, 72%),
          hsl(35, 100%, 68%));
      --jet: hsl(0, 0%, 22%);
      --eerie-black-1: hsl(240, 2%, 13%);
      --eerie-black-2: hsl(240, 2%, 12%);
      --smoky-black: hsl(0, 0%, 7%);
      --white-1: hsl(0, 0%, 100%);
      --light-gray: hsl(0, 0%, 84%);
      --orange-yellow-crayola: hsl(45, 100%, 72%);
      --fw-300: 300;
      --fw-500: 500;
      --shadow-2: 0 16px 30px hsla(0, 0%, 0%, 0.25);
      --transition-1: 0.25s ease;
    }

    /* ---- Reset ---- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--smoky-black);
      color: var(--white-1);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2vw;
    }

    /* ---- Card ---- */
    .thankyou-card {
      background: var(--bg-gradient-jet);
      border: 1px solid var(--jet);
      border-radius: 2vw; /* responsive */
      box-shadow: var(--shadow-2);
      padding: 5vw; /* responsive */
      max-width: 90vw;
      width: clamp(300px, 50%, 500px);
      text-align: center;
      animation: fadeIn 0.8s ease-in-out;
    }

    .thankyou-card h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 1500;
      background: var(--text-gradient-yellow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.5vw;
    }

    .thankyou-card p {
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      font-weight: var(--fw-300);
      color: var(--light-gray);
      margin-bottom: 2vw;
      line-height: 1.6;
    }

    .thankyou-card a {
      display: inline-block;
      background: var(--orange-yellow-crayola);
      color: var(--smoky-black);
      font-weight: var(--fw-500);
      padding: clamp(8px, 1.5vw, 12px) clamp(16px, 3vw, 24px);
      border-radius: 1vw;
      transition: var(--transition-1);
      text-decoration: none;
    }

    .thankyou-card a:hover {
      background: hsl(45, 100%, 60%);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="thankyou-card">
    <h1>Thank You!</h1>
    <p>Your submission has been <br/>
        received successfully.<br/>
      I’ll get back to you as soon as possible.</p>
    <a href="https://aniket-seven.vercel.app">Back to Home</a>
  </div>
</body>

</html>
